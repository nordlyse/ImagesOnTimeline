[package]
name = "timeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Web timeline that lays folder pictures out like a film strip."
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
heic-rs = "0.1"
jpeg-encoder = "=0.6.0"

[dev-dependencies]
filetime = "0.2"
